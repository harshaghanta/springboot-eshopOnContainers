name: "Vault One-Time Initialization"

on:
  workflow_dispatch:

jobs:
  init-vault:
    name: "Initialize Vault"
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ vars.EKS_CLUSTER_NAME }}

      - name: Check Status, Initialize, and Save to AWS Secrets Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          # 1. Wait until the Vault pod exists and is in the 'Running' state
          echo "Waiting for vault-0 pod to be running..."
          kubectl wait --namespace vault --for=condition=Ready pod/vault-0 --timeout=120s

          # 2. Safely fetch Vault status using the explicit container name '-c vault'
          STATUS_JSON=$(kubectl exec -n vault vault-0 -c vault -- vault status -format=json 2>/dev/null || true)
          INIT_STATUS=$(echo "$STATUS_JSON" | jq -r '.initialized // false')

          if [ "$INIT_STATUS" = "true" ]; then
            echo "Vault is already initialized!"
            exit 0
          fi

          echo "Initializing Vault..."

          # 3. Run initialization targeting the explicit 'vault' container
          INIT_JSON=$(kubectl exec -n vault vault-0 -c vault -- vault operator init -format=json)

          # 4. Put/Create secret in Secrets Manager dynamically using the AWS_REGION environment variable
          SECRET_NAME="/vault/cluster-keys"

          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Updating existing secret in Secrets Manager..."
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "$INIT_JSON" \
              --region "$AWS_REGION"
          else
            echo "Creating new secret in Secrets Manager..."
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Vault initial root token and recovery keys" \
              --secret-string "$INIT_JSON" \
              --region "$AWS_REGION"
          fi

          echo "Vault successfully initialized! Keys stored in AWS Secrets Manager under '$SECRET_NAME'."